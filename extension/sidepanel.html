<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cheta</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="topbar-row">
          <h1 class="brand">Cheta</h1>
          <button
            id="toggle-memory-panel"
            class="btn btn-quiet"
            type="button"
            aria-expanded="false"
            aria-controls="memory-panel"
          >
            Memories
          </button>
        </div>

        <p id="conn-status" class="status" aria-live="polite"></p>
        <div id="degraded-banner" class="notice hidden"></div>

        <details id="settings" class="settings">
          <summary>Settings</summary>
          <div class="settings-body">
            <div class="field">
              <label for="base-url">API base URL</label>
              <input
                id="base-url"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="https://example.com"
              >
            </div>
            <div class="field">
              <label for="display-name">Display name</label>
              <input
                id="display-name"
                type="text"
                maxlength="128"
                autocomplete="off"
                placeholder="Your name"
              >
            </div>
            <div class="field">
              <label for="surface-user-id">Browser identity</label>
              <input id="surface-user-id" type="text" readonly>
            </div>
            <div class="settings-actions">
              <button id="save-settings" class="btn btn-quiet" type="button">Save</button>
              <button id="reset-base-url" class="btn btn-quiet" type="button">Reset URL</button>
            </div>
            <p id="settings-status" class="hint" aria-live="polite"></p>
          </div>
        </details>
      </header>

      <section id="page-context" class="page-context" aria-label="The page in the active tab">
        <div class="page-row">
          <button id="use-page" class="btn btn-quiet" type="button">Use this page</button>
          <span id="page-status" class="hint page-status" aria-live="polite"></span>
        </div>
        <div id="page-info" class="page-info hidden">
          <div id="page-title" class="page-title"></div>
          <div id="page-host" class="page-host"></div>
        </div>
        <div
          id="page-actions"
          class="page-actions hidden"
          role="group"
          aria-label="What to do with this page"
        >
          <button id="page-action-summarise" class="btn btn-quiet page-action" type="button">
            Summarise this page
          </button>
          <button id="page-action-save" class="btn btn-quiet page-action" type="button">
            Save the useful facts to my memory
          </button>
          <button id="page-action-explain" class="btn btn-quiet page-action" type="button">
            Explain this to me like I am new to it
          </button>
        </div>
      </section>

      <section id="memory-panel" class="memory-panel hidden" aria-label="Stored memories">
        <div class="panel-head">
          <h2>Stored memories</h2>
          <button id="refresh-memories" class="btn btn-quiet" type="button">Refresh</button>
        </div>
        <label class="check" for="mem-include-inactive">
          <input id="mem-include-inactive" type="checkbox">
          <span>Include superseded and contradicted</span>
        </label>
        <p id="memory-status" class="hint" aria-live="polite"></p>
        <div id="memory-list" class="memory-list"></div>
      </section>

      <main id="transcript" class="transcript" aria-live="polite">
        <div id="empty-hint" class="empty">
          Say something durable, for example a preference, a constraint, or a fact
          about your work. Each reply shows the memories that were recalled for it.
          Type /help for commands.
        </div>
      </main>

      <form id="composer" class="composer">
        <label class="sr-only" for="chat-input">Message</label>
        <textarea
          id="chat-input"
          rows="2"
          maxlength="8000"
          placeholder="Message Cheta"
        ></textarea>
        <div class="composer-row">
          <label class="switch" for="memory-toggle">
            <input id="memory-toggle" type="checkbox" checked>
            <span>Memory</span>
          </label>
          <span id="memory-toggle-state" class="switch-state">On</span>
          <button id="send-button" class="btn btn-accent" type="submit">Send</button>
        </div>
      </form>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
