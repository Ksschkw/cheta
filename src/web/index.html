<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Cheta is a memory-first assistant.">
    <title>Cheta</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="chat-body">
    <div id="chat-app" class="chat-app">
      <header class="chat-head">
        <p class="wordmark">CHETA</p>
        <div class="head-actions">
          <details class="settings">
            <summary class="settings-toggle">Settings</summary>
            <div class="settings-panel">
              <label class="field-label" for="display-name">Display name</label>
              <input
                id="display-name"
                type="text"
                maxlength="128"
                autocomplete="off"
                placeholder="Optional"
              >
              <p class="field-note">Saved in this browser and sent with each message.</p>
            </div>
          </details>
          <a class="head-link" href="dashboard.html">Memory</a>
        </div>
      </header>

      <div id="degraded-banner" class="banner hidden" role="status"></div>

      <main
        id="transcript"
        class="transcript"
        aria-live="polite"
        aria-label="Conversation with Cheta"
      ></main>

      <form id="composer" class="composer">
        <label class="sr-only" for="chat-input">Message</label>
        <textarea
          id="chat-input"
          rows="1"
          maxlength="8000"
          placeholder="Message Cheta"
        ></textarea>
        <div class="composer-row">
          <label class="mini-switch" for="memory-toggle">
            <input id="memory-toggle" type="checkbox" checked>
            <span class="mini-track" aria-hidden="true"><span class="mini-thumb"></span></span>
            <span class="mini-label">Memory</span>
          </label>
          <span class="composer-hint">Enter sends, Shift+Enter adds a line</span>
          <button id="send-button" class="send" type="submit">Send</button>
        </div>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
